spring:
  application:
    name: chupapo-api

  datasource:
    url: jdbc:postgresql://localhost:5432/chupapo
    username: chupapo
    password: chupapo

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        secure: false
        same-site: lax

app:
  localization:
    languages:
      - RU
      - EN

  bootstrap-admin:
    username: ${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}